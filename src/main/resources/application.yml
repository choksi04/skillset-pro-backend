spring:
  application:
    name: skillset-pro-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences: ${ENTRA_AUDIENCE}
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  api:
    internal-error-message: An unexpected error occurred
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
