name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Require Docker for PostgreSQL integration tests
        run: docker info
      - name: Verify formatting, tests, coverage, and packaging
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
